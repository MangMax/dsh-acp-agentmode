name: CI

# Every change lands through a pull request; these are the required checks.
# A pull request from a fork cannot boot a real harness with this bundle
# installed, so the end-to-end smoke runs on main (and on demand) only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check (format, lint, types)
        run: pnpm exec vp check
      - name: Test
        run: pnpm exec vp test
      - name: Pack
        run: pnpm exec vp pack

  package:
    name: package contents
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Pack
        run: pnpm exec vp pack
      - name: Assert the tarball ships what the harness loads
        run: |
          set -euo pipefail
          pnpm pack --config.ignore-scripts=true >/dev/null
          tgz=$(ls -t ./*.tgz | head -1)
          echo "inspecting $tgz"
          tar -tzf "$tgz" | sort > /tmp/contents.txt
          for required in \
            package/dist/index.mjs \
            package/dist/index.d.mts \
            package/cordis.patch.yml \
            package/presets/standard.patch.yml \
            package/presets/ptc.patch.yml \
            package/presets/minimal.patch.yml \
            package/presets/cordis.patch.yml \
            package/locale/en.json \
            package/icon.svg
          do
            grep -qx "$required" /tmp/contents.txt || { echo "missing: $required"; exit 1; }
          done
          if grep -q '^package/node_modules/' /tmp/contents.txt; then
            echo "the tarball must not ship node_modules"; exit 1
          fi
          echo "package contents OK"

  smoke:
    name: harness smoke (main only)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Look for a local DeepSeek Harness
        id: harness
        run: |
          if command -v dsh >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no dsh on PATH; skipping the end-to-end smoke"
          fi
      - name: Pack
        if: steps.harness.outputs.available == 'true'
        run: pnpm exec vp pack
      - name: End-to-end smoke
        if: steps.harness.outputs.available == 'true'
        run: pnpm smoke -- --agentmode minimal
